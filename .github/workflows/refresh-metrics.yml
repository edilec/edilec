name: Refresh public engineering signal

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

concurrency:
  group: public-engineering-signal
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify evidence panels
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    env:
      PROFILE_KIND: company
      PROFILE_LABEL: Edilec
      PROFILE_REPOSITORIES: >-
        edilec/sitemap-cohort-auditor,
        edilec/inline-json-for-html,
        edilec/svg-semantic-layout-auditor,
        edilec/content-identity-auditor
      EXPECTED_REPOSITORIES: "4"
    steps:
      - name: Check out the profile source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test the renderer
        run: node --test .github/scripts/render-engineering-signal.test.mjs

      - name: Render from the explicit repository allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/engineering-signal"
          node .github/scripts/render-engineering-signal.mjs "$output"

      - name: Validate generated SVGs
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/engineering-signal"
          expected=(
            engineering-signal-light.svg
            engineering-signal-dark.svg
            engineering-signal-mobile-light.svg
            engineering-signal-mobile-dark.svg
          )
          test "$(find "$directory" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"

          for filename in "${expected[@]}"; do
            file="$directory/$filename"
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            test "$bytes" -ge 1000
            test "$bytes" -le 200000
            head -c 512 "$file" | grep -Eqi '<svg([[:space:]>])'
            grep -Fq 'data-component="repository-evidence"' "$file"
            grep -Fq 'data-schema="1"' "$file"
            grep -Fq "data-profile=\"$PROFILE_KIND\"" "$file"
            grep -Fq "data-repositories=\"$EXPECTED_REPOSITORIES\"" "$file"

            layout=desktop
            if [[ "$filename" == *mobile* ]]; then
              layout=mobile
            fi
            grep -Fq "data-layout=\"$layout\"" "$file"

            if grep -Eqi '<(script|foreignObject|image|iframe|object|embed|link|meta|use)([[:space:]>])|javascript:|[[:space:]]on[a-z]+[[:space:]]*=|@import' "$file"; then
              echo "Unsafe active content found in $filename" >&2
              exit 1
            fi
            if grep -Eqi "(href|xlink:href|src)[[:space:]]*=[[:space:]]*['\"](https?:)?//|url[[:space:]]*\([[:space:]'\"]*(https?:)?//" "$file"; then
              echo "External resource reference found in $filename" >&2
              exit 1
            fi
          done

      - name: Upload validated evidence panels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-engineering-signal
          path: ${{ runner.temp }}/engineering-signal/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish changed evidence panels
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PROFILE_KIND: company
      EXPECTED_REPOSITORIES: "4"
    steps:
      - name: Download validated evidence panels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-engineering-signal
          path: ${{ runner.temp }}/engineering-signal

      - name: Revalidate and publish only semantic changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/engineering-signal"
          expected=(
            engineering-signal-light.svg
            engineering-signal-dark.svg
            engineering-signal-mobile-light.svg
            engineering-signal-mobile-dark.svg
          )
          test "$(find "$directory" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"

          for filename in "${expected[@]}"; do
            file="$directory/$filename"
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            test "$bytes" -ge 1000
            test "$bytes" -le 200000
            head -c 512 "$file" | grep -Eqi '<svg([[:space:]>])'
            grep -Fq 'data-component="repository-evidence"' "$file"
            grep -Fq 'data-schema="1"' "$file"
            grep -Fq "data-profile=\"$PROFILE_KIND\"" "$file"
            grep -Fq "data-repositories=\"$EXPECTED_REPOSITORIES\"" "$file"
            if grep -Eqi '<(script|foreignObject|image|iframe|object|embed|link|meta|use)([[:space:]>])|javascript:|[[:space:]]on[a-z]+[[:space:]]*=|@import' "$file"; then
              echo "Unsafe active content found in $filename" >&2
              exit 1
            fi
            if grep -Eqi "(href|xlink:href|src)[[:space:]]*=[[:space:]]*['\"](https?:)?//|url[[:space:]]*\([[:space:]'\"]*(https?:)?//" "$file"; then
              echo "External resource reference found in $filename" >&2
              exit 1
            fi
          done

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/metrics-renders" >/dev/null 2>&1; then
            default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
            default_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/metrics-renders \
              -f sha="$default_sha" >/dev/null
          fi

          for filename in "${expected[@]}"; do
            file="$directory/$filename"
            target="assets/metrics/$filename"
            existing_sha=""
            existing_file=$(mktemp)
            if gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=metrics-renders" \
              --jq .content 2>/dev/null | tr -d '\n' | base64 --decode > "$existing_file"; then
              if cmp -s "$file" "$existing_file"; then
                echo "$filename is already current"
                continue
              fi
              existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=metrics-renders" --jq .sha)
            fi

            content=$(base64 < "$file" | tr -d '\n')
            args=(
              --method PUT
              "repos/$GITHUB_REPOSITORY/contents/$target"
              -f "message=chore(metrics): refresh engineering signal"
              -f content="$content"
              -f branch=metrics-renders
            )
            if test -n "$existing_sha"; then
              args+=( -f sha="$existing_sha" )
            fi
            gh api "${args[@]}" >/dev/null
          done
