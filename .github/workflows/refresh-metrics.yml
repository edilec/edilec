name: Refresh local profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

concurrency:
  group: local-profile-assets
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh committed GitHub profile assets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    env:
      PROFILE_LOGIN: edilec
      PROFILE_LABEL: Edilec
    steps:
      - name: Check out the profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Render the local profile assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/render-profile-assets.mjs assets/profile

      - name: Validate the local SVGs
        shell: bash
        run: |
          set -euo pipefail
          directory="assets/profile"
          expected=(
            profile-wave-light.svg
            profile-wave-footer-light.svg
            github-activity-light.svg
            contribution-grid-light.svg
          )
          test "$(find "$directory" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge "${#expected[@]}"

          for filename in "${expected[@]}"; do
            file="$directory/$filename"
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            test "$bytes" -ge 500
            test "$bytes" -le 200000
            head -c 512 "$file" | grep -Eqi '<svg([[:space:]>])'
            if grep -Eqi '<(script|foreignObject|image|iframe|object|embed|link|meta|use)([[:space:]>])|javascript:|[[:space:]]on[a-z]+[[:space:]]*=|@import' "$file"; then
              echo "Unsafe active content found in $filename" >&2
              exit 1
            fi
            if grep -Eqi '(href|xlink:href|src)[[:space:]]*=[[:space:]]*"?https?://' "$file"; then
              echo "External asset reference found in $filename" >&2
              exit 1
            fi
          done

      - name: Open a reviewable refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/profile-assets-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"

          if git diff --quiet -- assets/profile; then
            echo "Local profile assets are already current."
            exit 0
          fi

          git add assets/profile
          git commit -m "chore(profile): refresh local GitHub assets"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(profile): refresh local GitHub assets" --body "Refresh the committed light profile wave, activity summary and contribution calendar from GitHub account data. The README uses these local assets so the profile does not depend on external image services."
